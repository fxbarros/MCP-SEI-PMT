[project]
name = "sei-mcp"
version = "0.1.0"
description = "Servidor MCP do SEI da Prefeitura de Teresina para o Claude Desktop: caixa, PDFs, pareceres, minutas e documentos via API REST (escrita só com confirmação)"
readme = "README.md"
authors = [
    { name = "Fábio Ximenes Barros" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp[cli]>=1.27.0",
    "openpyxl>=3.1.5",
    "patchright>=1.58.2",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
]

[project.scripts]
sei-mcp = "sei_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a suíte é 100% offline: wssei falso em memória, sem Keychain e sem Chrome (ver tests/conftest.py)
