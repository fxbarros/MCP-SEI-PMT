[project]
name = "sei-mcp"
version = "0.1.0"
description = "MCP server for SEI-PMT (Prefeitura Municipal de Teresina)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "keyring>=25.7.0",
    "mcp[cli]>=1.27.0",
    "openpyxl>=3.1.5",
    "patchright>=1.58.2",
    "httpx>=0.28.1",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "playwright>=1.58.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
sei-mcp = "sei_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
